name: Forma checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORMA_MODE: local
      APP_ORIGIN: http://127.0.0.1:5173
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup:ocr
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:backend
      - run: npm run test:billing
      - run: npm run test:account
      - run: npm run test:db
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
